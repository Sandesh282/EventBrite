# .github/workflows/ci.yml
#
# CI quality gate — runs on every push and pull request to main.
#
# Steps (in order):
#   1. Type-check   — tsc --noEmit (zero tolerance for TS errors)
#   2. Unit tests   — vitest run __tests__/unit (no DB required, fast)
#   3. Lint         — eslint (if configured)
#
# Concurrency tests (which need DATABASE_URL) run separately in
# concurrency.yml on pushes to main to avoid needing DB secrets on PRs.
#
# Why Node 22?
#   Matches the local development version confirmed in .nvmrc / package.json.
#   Using a pinned version prevents CI surprises from Node auto-upgrades.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Type-check + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------------------------
      # Step 1: TypeScript — zero errors policy.
      # tsc --noEmit validates types without emitting JS.
      # If this fails, the PR is blocked — no exceptions.
      # -------------------------------------------------------------------
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # -------------------------------------------------------------------
      # Step 2: Unit tests — fast, no DB, no secrets needed.
      # These run on every commit including PRs.
      # Coverage report is uploaded as an artifact for review.
      # -------------------------------------------------------------------
      - name: Unit tests
        run: npx vitest run __tests__/unit --reporter=verbose

      - name: Unit test coverage
        run: npx vitest run __tests__/unit --coverage
        continue-on-error: true   # coverage report is informational on PRs

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
